name: verbo_vivo
description: VerboVivo - descubra temas bíblicos e conteúdos cristãos.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  http: ^1.3.0
  just_audio: ^0.9.46
  just_audio_windows: ^0.2.3
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  youtube_explode_dart: ^3.1.0
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 23
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icon/app_icon.png
