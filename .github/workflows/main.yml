name: Build & Release VerboVivo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID (APK) & LINUX (DEB)
  # ==========================================
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libepoxy-dev
          pkg-config --print-errors --exists mpv epoxy

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle Repositories & Mirrors
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/repositories.init.gradle
          gradle.beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      # Build APK
      - name: Build Android APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk verbovivo-android.apk

      # Build Linux Desktop & Package .deb
      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux .deb
        run: |
          APP_NAME="verbovivo"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(awk '/^version:[[:space:]]/ { print $2; exit }' pubspec.yaml)
          fi
          if ! dpkg --validate-version "$VERSION"; then
            echo "::error::Invalid Debian package version: $VERSION"
            exit 1
          fi
          ARCH="amd64"
          STAGE_DIR="deb-package/${APP_NAME}_${VERSION}_${ARCH}"

          mkdir -p "$STAGE_DIR/usr/bin"
          mkdir -p "$STAGE_DIR/usr/lib/$APP_NAME"
          mkdir -p "$STAGE_DIR/usr/share/applications"
          mkdir -p "$STAGE_DIR/DEBIAN"

          cp -r build/linux/x64/release/bundle/* "$STAGE_DIR/usr/lib/$APP_NAME/"
          test -x "$STAGE_DIR/usr/lib/$APP_NAME/verbo_vivo"
          ln -s "/usr/lib/$APP_NAME/verbo_vivo" "$STAGE_DIR/usr/bin/$APP_NAME"

          cat <<EOF > "$STAGE_DIR/DEBIAN/control"
          Package: $APP_NAME
          Version: $VERSION
          Architecture: $ARCH
          Depends: libmpv2
          Maintainer: Aldo Barduco Neto
          Description: VerboVivo application
          EOF

          cat <<EOF > "$STAGE_DIR/usr/share/applications/$APP_NAME.desktop"
          [Desktop Entry]
          Name=VerboVivo
          Exec=/usr/bin/$APP_NAME
          Terminal=false
          Type=Application
          Categories=Utility;Education;
          EOF

          dpkg-deb --build "$STAGE_DIR"
          mv "deb-package/${APP_NAME}_${VERSION}_${ARCH}.deb" verbovivo-linux.deb

      - name: Upload Artifacts (Ubuntu)
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts
          path: |
            verbovivo-android.apk
            verbovivo-linux.deb

  # ==========================================
  # 2. WINDOWS (EXE com Inno Setup)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup Script & Compile Installer
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=VerboVivo
          AppVersion=1.0.0
          DefaultDirName={autopf}\VerboVivo
          DefaultGroupName=VerboVivo
          OutputDir=.
          OutputBaseFilename=VerboVivo-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\VerboVivo"; Filename: "{app}\verbovivo.exe"
          Name: "{autodesktop}\VerboVivo"; Filename: "{app}\verbovivo.exe"
          "@
          Set-Content -Path "installer.iss" -Value $issContent
          ISCC.exe installer.iss

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: VerboVivo-Setup.exe

  # ==========================================
  # 3. MACOS & IOS (DMG e IPA)
  # ==========================================
  build-macos-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build macOS & DMG
      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Create DMG
        shell: bash
        run: |
          shopt -s nullglob
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "::error::Expected exactly one macOS app in the Release build directory."
            exit 1
          fi

          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          ditto "${apps[0]}" "$staging/${apps[0]##*/}"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname VerboVivo -srcfolder "$staging" -format UDZO verbovivo-macos.dmg

      # Build iOS IPA (unsigned payload)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 verbovivo-ios.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts (macOS & iOS)
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          path: |
            verbovivo-macos.dmg
            verbovivo-ios.ipa

  # ==========================================
  # 4. PUBLISH TO GITHUB RELEASES
  # ==========================================
  release:
    needs: [build-ubuntu, build-windows, build-macos-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Standardize Filenames
        run: |
          cd release_assets
          if [ ! -f "verbovivo-android.apk" ]; then
            found_apk=$(find . -name "*.apk" | head -n 1)
            [ -n "$found_apk" ] && mv "$found_apk" verbovivo-android.apk
          fi
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_assets/verbovivo-android.apk
            release_assets/verbovivo-linux.deb
            release_assets/VerboVivo-Setup.exe
            release_assets/verbovivo-macos.dmg
            release_assets/verbovivo-ios.ipa
